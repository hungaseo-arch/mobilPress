name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_DATA_MODE: ${{ secrets.VITE_DATA_MODE }}
          VITE_NEON_DATA_API_URL: ${{ secrets.VITE_NEON_DATA_API_URL }}
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
          # 작업보고서·주행거리계 사진 업로드(Apps Script). 미등록 시 driveEnabled=false 로 빌드되어
          # 업로드 버튼이 사라지므로 반드시 리포지토리 secrets 에 등록한다 (docs/CONTRIBUTING.md).
          VITE_DRIVE_UPLOAD_URL: ${{ secrets.VITE_DRIVE_UPLOAD_URL }}
          VITE_DRIVE_UPLOAD_TOKEN: ${{ secrets.VITE_DRIVE_UPLOAD_TOKEN }}
        run: npm run predeploy

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
